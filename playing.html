<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NOW PLAYING</title>
    <link rel="stylesheet" href="style2.css" />
  </head>
  <body>

    <div class="header">
      <a href="index.html"
        ><img src="images/logo.jpg" alt="logo"
      /></a>
      <h1>FlowTunes</h1>
    </div>

    <div class="main">
      <img src="images/music-logo-design.jpg" alt="song icon" id="songicon"/>
      <br>
      <h2 id="nowPlayingSong">Now Playing</h2>

    </div>

    <div class="duration">
      <div class="line"></div>
      <div class="circle"></div>
    </div>

    <div class="controls">
      <img src="images/previous.jpg" alt="back" id="previous"/>
      <img src="images/playbuttn.png" alt="play" id="playbuttn" />
      <img src="images/next-track.jpg" alt="forword" id="next"/>
      <img src="images/add.jpg" alt="add" id="addToPlaylist">
    </div>

    <div class="bottom">
        CopyRights RESERVED to FlowTunes 2026
    </div>
    <script src="playing.js"></script>
  </body>
</html>
